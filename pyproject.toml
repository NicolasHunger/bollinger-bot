[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bollinger-bot"
version = "0.1.0"
description = "Trading-Bot mit der Bollinger-Strategie auf dem Bitget-Demo-Konto (Schulprojekt M450)"
readme = "README.md"
requires-python = ">=3.12"
# Untergrenze: die Version, mit der wir entwickeln. Obergrenze: das nächste Release, das
# Bestehendes brechen darf, also das nächste Major-Release, bei Paketen unter 1.0 die nächste
# Minor-Version (httpx 0.28 hat z.B. «proxies» entfernt). So kommen Fehlerkorrekturen rein,
# aber kein Umbau kurz vor der Abgabe.
dependencies = [
    "httpx>=0.28,<0.29",
    "streamlit>=1.64,<2",
]

# Nur für Entwicklung und Tests, landet nicht im Docker-Image.
[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-cov>=7.1,<8",
    "pytest-html>=4.2,<5",
    "pytest-mock>=3.16,<4",
    "respx>=0.23,<0.24",
    # Zeitzonen-Datenbank für ZoneInfo in tests/unit/test_polling.py. Linux und macOS bringen sie
    # mit, Windows nicht. Ohne Obergrenze: Neuere Versionen bringen nur aktuellere Zeitzonen-Regeln.
    "tzdata; sys_platform == 'win32'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# importlib: Testdateien in verschiedenen Ordnern dürfen gleich heissen.
# Unit- und Integrationstests trennen wir über die Ordner, nicht über Marker:
#   pytest tests/unit  bzw.  pytest tests/integration
# --strict-markers bleibt trotzdem an, damit ein vertippter Marker auffällt.
addopts = "--import-mode=importlib --strict-markers"
