# SonarQube Cloud: Die Analyse läuft im Job «SonarQube Cloud» in .github/workflows/pipeline.yml.
# Automatic Analysis ist im Projekt ausgeschaltet, sonst analysieren Sonar und die Pipeline doppelt.
sonar.organization=nicolashunger
sonar.projectKey=NicolasHunger_bollinger-bot
sonar.projectName=Bollinger-Bot

sonar.sources=src
sonar.tests=tests
sonar.python.version=3.12

# Reports aus den Test-Jobs, einer pro Testordner. Sonar zählt die Coverage beider Ordner zusammen.
sonar.python.coverage.reportPaths=reports/*/coverage.xml
sonar.python.xunit.reportPath=reports/*/junit.xml

# Bewusst ausgenommen: die Regeln «kein Lockfile» (Entscheid Nicolas, 26.10.2026). Ein Lockfile
# müssten alle bei jeder neuen Abhängigkeit nachführen, kurz vor der Abgabe zu riskant. Dafür
# haben alle Abhängigkeiten Versionsgrenzen in der pyproject.toml, und die Pipeline installiert
# nur fertige Pakete (--only-binary :all:).
sonar.issue.ignore.multicriteria=lockWorkflow,lockPyproject
sonar.issue.ignore.multicriteria.lockWorkflow.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.lockWorkflow.resourceKey=.github/workflows/pipeline.yml
sonar.issue.ignore.multicriteria.lockPyproject.ruleKey=text:S8565
sonar.issue.ignore.multicriteria.lockPyproject.resourceKey=pyproject.toml
